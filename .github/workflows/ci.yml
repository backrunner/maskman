name: maskman-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate one-click installer
        run: bash -n scripts/install.sh && scripts/install.sh --dry-run --color never
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
      - uses: taiki-e/install-action@cargo-machete
      - run: cargo machete
      - run: cargo run --locked -p xtask -- compliance
      - run: cargo run --locked -p xtask -- benchmark --iterations 100000
      - name: Exercise non-interactive development setup
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          cargo run --locked -p maskman -- --color never setup \
            --non-interactive --development --enable-udp --yes \
            --output "$smoke_dir/config.toml" > "$smoke_dir/setup.log"
          cargo run --locked -p maskman -- --color never \
            --config "$smoke_dir/config.toml" config validate > "$smoke_dir/validate.log"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked

  build-targets:
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - aarch64-apple-darwin
    runs-on: ${{ matrix.target == 'aarch64-apple-darwin' && 'macos-14' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Setup Zig
        if: matrix.target != 'aarch64-apple-darwin'
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: Install cargo-zigbuild
        if: matrix.target != 'aarch64-apple-darwin'
        uses: taiki-e/install-action@cargo-zigbuild
      - name: Build locked target
        run: |
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            cargo build --release --locked --target "${{ matrix.target }}"
          else
            cargo zigbuild --release --locked --target "${{ matrix.target }}"
          fi
      - name: Record artifact metadata
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/maskman dist/maskman-${{ matrix.target }}
          printf '{"target":"%s","commit":"%s"}\n' '${{ matrix.target }}' '${{ github.sha }}' > dist/build-metadata.json
          sha256sum dist/maskman-${{ matrix.target }} > dist/maskman-${{ matrix.target }}.sha256 || shasum -a 256 dist/maskman-${{ matrix.target }} > dist/maskman-${{ matrix.target }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: maskman-${{ matrix.target }}
          path: dist/

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run bounded fuzz smoke
        working-directory: fuzz
        run: |
          for target in capsule_decoder datagram_payload connect_request_path ipv4_packet ipv6_packet_extensions route_advertisement config_toml config_json; do
            cargo fuzz run "$target" -- -max_total_time=15 -rss_limit_mb=1024 -malloc_limit_mb=64
          done
