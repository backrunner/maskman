[package]
name = "maskman"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
default-run = "maskman"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env", "color"] }
clap_complete = "4.5"
maskman-config = { path = "../maskman-config", version = "0.1.0" }
maskman-platform = { path = "../maskman-platform", version = "0.1.0" }
maskman-server = { path = "../maskman-server", version = "0.1.0" }
maskman-update = { path = "../maskman-update", version = "0.1.0" }
rand = "0.8"
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
